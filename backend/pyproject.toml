[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "livekit-agents>=1.5.8",
    "livekit-api>=1.1.0",
    "livekit-plugins-openai>=1.5.8",
    "livekit-plugins-silero>=1.5.8",
    "pydantic-ai>=1.90.0",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "ruff>=0.15.12",
    "slowapi>=0.1.9",
    "uvicorn>=0.46.0",
    "minio>=7.2.0",
    "redis>=5.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"